name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.14"] # the oldest s3tx supports, and the newest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Lint
        run: uvx ruff check .
      - name: Format check
        run: uvx ruff format --check .
      - name: Test (s3tx and tx against local stand-ins for S3 and the mediator)
        run: uv run --python ${{ matrix.python }} --with-requirements tests/requirements.txt python -m pytest tests/ -q -rxX

  mediator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24" # what the Vercel project runs
      - name: Syntax-check mediator functions
        working-directory: mediator
        run: |
          node --check api/register.js
          node --check "api/get/[code].js"
      - name: Unit tests (the handlers against an in-memory Redis)
        working-directory: mediator
        run: npm test

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint the tx client (shellcheck ships on ubuntu runners)
        run: |
          sh -n tx
          shellcheck --severity=warning tx
