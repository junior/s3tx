name: Tap

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# The Homebrew tap follows a release tag: the formula in junior/homebrew-tap gets
# this tag and its source tarball's checksum, committed and pushed with
# HOMEBREW_TAP_TOKEN, a fine-grained token with read and write access to the
# contents of that one repository, kept as a secret here. A pre-release tag (a
# hyphen in its name) leaves the tap alone.
jobs:
  tap:
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: junior/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Point the formula at this tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          url="https://github.com/junior/s3tx/archive/refs/tags/${TAG}.tar.gz"
          for attempt in 1 2 3 4 5 6; do
            curl -sSfL -o /tmp/src.tar.gz "$url" && break
            [ "$attempt" -lt 6 ] || { echo "no tarball at ${url}" >&2; exit 1; }
            sleep 10
          done
          sha=$(sha256sum /tmp/src.tar.gz | cut -d' ' -f1)
          sed -i -e "s|/archive/refs/tags/v[^\"]*\.tar\.gz|/archive/refs/tags/${TAG}.tar.gz|" \
                 -e "s|sha256 \"[0-9a-f]\{64\}\"|sha256 \"${sha}\"|" Formula/s3tx.rb
          if git diff --quiet; then
            echo "the formula already points at ${TAG}"
            exit 0
          fi
          git config user.name "junior"
          git config user.email "junior@users.noreply.github.com"
          git commit -am "s3tx ${TAG#v}"
          git push
